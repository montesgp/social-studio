scope:
  phase: 1
  name: "Discovery chain (references + own + TikTok niche search), configuration-driven actor routing, pure opportunity scorer, Trending/Proven classification, candidate + account-baseline persistence, ranked shortlist with single-selection instant analysis"
  roadmap:
    - phase: 2
      name: "Instagram and YouTube niche search sources"
      status: deferred
      notes: "One search adapter proves the shape; more networks multiply unverified provider schemas."
    - phase: 3
      name: "Clustering component + patterns table"
      status: deferred
      notes: >
        Clustering runs after deep analysis over extracted topics/hooks. Only the cheap pre-analysis
        lexical co-occurrence scoring signal ships now; the clustering schema is not yet justifiable.
    - phase: 4
      name: "True growth velocity (second observation of the same candidate)"
      status: deferred
      notes: "discovered_candidates records (candidate, observed_at, metrics) so a later second observation becomes possible."
    - phase: 5
      name: "Weighted strategy mix across sources"
      status: deferred
      notes: "Revisit at >=3 live sources per criterion; a configurable mix over one live source is a no-op with maintenance cost."
    - phase: 6
      name: "Competitor discovery source"
      status: deferred
      notes: "The 'competitors' criterion falls back to the default ordered chain until a dedicated source lands."
    - phase: 7
      name: "Magic Generator (multi-select background batch analysis of discovered candidates)"
      status: deferred
      notes: >
        Added by the 2026-08-09 scope amendment. This change is instant, single-selection only:
        the operator picks exactly one ranked candidate for synchronous analysis. Selecting
        multiple candidates for background batch processing is a separate, later change.

decisions:
  - "SearchCriterion becomes the discovery router; it is already normalized/validated and echoed into payloads but is never passed into ContentDiscoveryRequest (InMemoryContentWorkflowService.cs:130). No weighted allocator."
  - "ContentDiscoveryChain replaces the single IContentDiscoveryService registration at DependencyInjection.cs:220 in the same commit; a second registration would silently win and erase the first."
  - "TikTok first for niche search: its URL adapter already parses shares and publish date, the lowest schema risk."
  - "The 'own' criterion defect is fixed AND the own-winners source ships: it is a near-clone of ReferenceAccountContentDiscovery swapping ReferentAccounts for IClientOwnAccountRepository over the same IProfileScrapeResolver."
  - "Metrics are nullable with explicit availability, never zero-filled; zero-filling would systematically penalise whole networks."
  - "Two persistence tables now (discovered_candidates, account_baselines); no patterns/clustering table."
  - "Account baselines computed for already-scraped accounts (referents, own) and for TOP N after cheap filtering only; cached so cost amortizes. Never per candidate."
  - "Trending/Proven are single-snapshot proxies; Undetermined is a first-class outcome when PublishedAtUtc is unavailable. True velocity is deferred."
  - "Domain is untouched: discovery candidates are research data, not a business aggregate with invariants."
  - "ADR required by openspec/config.yaml (require_adr_for_architecture_changes): new Application port + new persistence model + DI registration replacement. Numbered 0012 because 0005 and 0006 are each used twice in docs/architecture/adr/."

non_goals:
  - "Instagram and YouTube niche search sources."
  - "Weighted 35/35/20/10 strategy mix."
  - "Clustering component and patterns table."
  - "Embeddings."
  - "True growth velocity measurement."
  - "Competitor discovery source."
  - "YouTube seeding in SocialNetworkCatalogSeeder."
  - "Persisting workflow sessions (InMemoryContentWorkflowService stays in-memory)."
  - "Frontend redesign; only the existing 'own' option starts succeeding."
  - "Automatic TOP-N background fan-out into deep analysis (added by the 2026-08-09 amendment; superseded by single-selection instant synchronous analysis). Multi-select background batch processing is the separate, later Magic Generator change."
  - "Hardcoding any discovery actor id in Application/Infrastructure code (added by the 2026-08-09 amendment); actor routing is always workflow/step configuration-driven."

design_decisions:
  - "D1 IContentDiscoveryService returns ContentDiscoveryPlan(Candidates, Shortfall, FailedSourceKeys); a bare list cannot satisfy CD-01/CD-11 at the port boundary."
  - "D2 Metric availability is plain long? — null = network does not report, 0 = reported zero. No parallel (value,isAvailable) wrapper."
  - "D3 (OQ-3 RESOLVED) candidate_key = '{network}:{normalized content URL}' via one pure CandidateIdentity.From shared by in-run dedup and the DB column."
  - "D4 (OQ-2 RESOLVED) Source declares Supports(criterion); 'niche' gets the niche source ONLY, no filler. Shortfall is the honest answer."
  - "D5 'viral'/'competitors' claimed by no source -> chain consults ALL sources in order (CD-03)."
  - "D6 Append-only observation rows sharing candidate_key; no identity/observation table split."
  - "D7 (OQ-5 RESOLVED) Scorer weights are fixed constants in code; per-org configuration is dead config over one scorer."
  - "D8 REPLACED 2026-08-09 (OQ-6 now moot): single selection reuses the EXISTING AnalyzeSingleContentCommand endpoint + existing client polling overlay (AnalyzeSingleContentHandler = StartAsync + EnqueueAsync; single-analyzer-client.tsx polls every 2500ms). No new command, endpoint, queue, progress channel or concurrency primitive. The withdrawn fan-out moves to Magic Generator."
  - "D11 Discovery configuration ships as a NEW analysis type 'content-discovery' under the EXISTING 'generator' workflow key (step 'discover-niche-content'), not a new top-level workflow key: the settings selector is built from checklistGroups, and 'generator' already has one, so INT-DISC-03 is satisfied by construction (WorkflowConfigurationCatalog.cs:123-126 trap avoided). One optional checklist item is appended to generatorChecklist."
  - "D12 ContentDiscoveryPlan gains UnconfiguredSourceKeys, distinct from FailedSourceKeys (CD-13). Confirmed, not assumed: FailedSourceKeys alone cannot distinguish 'no actor configured' from 'provider errored'. IContentDiscoverySource returns SourceDiscoveryResult(Outcome: Ran|Unconfigured|Failed, Candidates)."
  - "D13 No literal actor id anywhere in Application/Infrastructure (CD-12/INT-DISC-01). Resolution is IWorkflowConfigurationResolver.ResolveStepAsync + actor_mappings_json, mirroring ApifyProfileScrapeResolver.cs:146-163. A seeded placeholder mapping is DATA, never a code fallback. A repository-wide no-actor-literal test guards it, written RED first."
  - "D9 (OQ-4 RESOLVED for this change) No purge now; index (organization_id, observed_at) makes the later purge one ranged delete. Named follow-up."
  - "D10 Domain untouched — CONFIRMED after challenging the ProfileStats precedent. Revisit trigger: a candidate gaining an operator lifecycle (select/dismiss/archive)."
  - "OQ-7 RESOLVED: co-occurrence tokenizes Title+Summary (lowercase, punctuation stripped, tokens >= 4 chars, ES+EN stopwords); signal = max distinct-author count per token, K = 3, normalized by set author count."
  - "Assumed configurable values: trending window 14d, proven floor 90d, TOP N = 8, baseline TTL 30d."

open_questions:
  - "OQ-1 BLOCKING (RESTRUCTURED 2026-08-09) — Apify niche-search SCHEMA spike unresolved. It verifies the response shape of whatever actor the OPERATOR has configured for (tiktok, niche-search); the actor id is an input to the spike, never chosen or named by the design, and never enters code, tests or fixture names (CD-12/D13). Inputs to try: searchQueries / hashtags. No adapter code may be committed before a sanitized capability-named fixture exists. Missing playCount = escalate, do not ship. Unmappable shape handling is specified in design §7.1."
  - "PQ-1 Trending window / proven floor values (assumed 14d / 90d, configurable)."
  - "PQ-2 TOP N fixed vs operator-chosen (assumed small fixed 5-10). Now display-only: N bounds the shortlist shown, not how many analyses run (always exactly one)."
  - "PQ-3 Account baseline staleness TTL (assumed ~30 days)."
  - "PQ-4 Instagram-only references/own: acceptable first slice for a TikTok-only client?"
  - "PQ-5 'viral'/'competitors' silent fallback to the default chain vs explicit not-implemented response."

risks:
  - "Response schema of whichever actor the operator configures for niche search is verified by documentation only, never a live call. Schema spike REQUIRED before adapter code is committed."
  - "A literal actor id creeping into code as a temporary convenience; guarded by a repository-wide no-actor-literal test written RED first."
  - "Discovery stage rendering as 'not configurable yet' if it were given a workflow key without a checklist group; avoided by reusing the 'generator' key (D11)."
  - "Silent DI override erasing a source if line 220 is supplemented instead of replaced."
  - "DiscoveredContent contract change breaks ReferenceAccountContentDiscovery and its tests (deliberate, coordinated)."
  - "Baseline scraping cost overrun if baselines leak beyond known accounts and TOP N."
  - "Zero-filled metrics skewing the score across networks."
  - "Trending/Proven misread as measurement rather than snapshot proxy."
  - "PR size roughly 3,000-4,000 changed lines, far over the review budget (knowingly accepted)."
  - "Instagram-only profile scraping limits references/own for TikTok-first clients."

