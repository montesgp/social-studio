scope:
  phase: 2
  name: "Real visual fidelity for ClientAesthetic: capture client post images + captions, persist durably, multimodal multi-signal style extraction (creatives-first, palette OPTIONAL), feed real creatives into the AI visual designer, remove grey-default when no brand manual."

decisions:
  - "Creatives-first: the client's real post images/backgrounds are the PRIMARY signal; palette is optional and may be inconsequential — never fabricate a default palette."
  - "For ClientAesthetic the feed IS the brand manual; a missing manual is valid, not a degrade to greys."
  - "OQ-1 actor capability is a BLOCKING spike (WU-0): current persisted dataset is metadata-only (verified)."
  - "Bounds (owner-tunable): N=18 posts, thumbnails (~1024px), reference cap 6 once-per-job."
  - "Engine stays HTML/CSS -> raster; no image-generation/diffusion; no pixel template reuse; photographic feeds out of scope."
  - "Non-blocking refresh-if-stale contract from Phase 1 preserved unchanged."

non_goals:
  - "Image-generation/diffusion models."
  - "Pixel-perfect reuse of a client's exact post as a template (ClientDefinedSet territory)."
  - "Photographic feeds (engine ceiling, documented)."
  - "Blocking/waiting-for-analysis generation job state."
  - "Changes to ClientDefinedSet / AiPalette behavior."

open_questions:
  - "OQ-1 actor choice — BLOCKING spike (WU-0)."
  - "OQ-2/OQ-3/OQ-4 cost bounds — defaults set (N=18, thumbnails, cap 6), owner-tunable."
  - "OQ-7 retention/privacy — keep latest analysis images only; owner-confirm."
  - "OQ-8 weak/absent palette — derive colour freely from creatives; soft palette only."

