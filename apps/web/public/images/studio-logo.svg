<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="Social Studio">
  <!--
    Canonical Social Studio mark for use OUTSIDE React: emails, docs, OG images, slide decks.

    Inside the app use components/auth/studio-logo.tsx instead — same geometry, but it draws from the
    theme tokens so it follows light and dark. This file hard-codes brand colours because a standalone
    asset has no document to inherit from, and it avoids `currentColor` for the same reason: dropped
    into an <img> that would silently resolve to black.
  -->
  <g stroke="#94A3B8">
    <polygon points="32,7 55,20 55,44 32,57 9,44 9,20" stroke-width="2" stroke-opacity="0.55" />
    <g stroke-width="1.25" stroke-opacity="0.45">
      <line x1="32" y1="32" x2="32" y2="4" />
      <line x1="32" y1="32" x2="56" y2="18" />
      <line x1="32" y1="32" x2="56" y2="46" />
      <line x1="32" y1="32" x2="32" y2="60" />
      <line x1="32" y1="32" x2="8" y2="46" />
      <line x1="32" y1="32" x2="8" y2="18" />
    </g>
  </g>

  <g fill="#933FF3">
    <circle cx="32" cy="4" r="3.5" />
    <circle cx="56" cy="18" r="3.5" />
    <circle cx="56" cy="46" r="3.5" />
    <circle cx="32" cy="60" r="3.5" />
    <circle cx="8" cy="46" r="3.5" />
    <circle cx="8" cy="18" r="3.5" />

    <polygon points="32,20 44,27 44,40 32,47 20,40 20,27" />
    <polygon points="32,20 44,27 32,34 20,27" fill-opacity="0.55" />
  </g>
</svg>
